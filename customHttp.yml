customHeaders:
  # Seguridad para todo el sitio
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
  # Archivos con hash de Vite: caché de un año
  - pattern: 'assets/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # HTML: siempre revalidar para que los despliegues se vean al instante
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
  - pattern: '*.html'
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
  # Imágenes e iconos de public/ (sin hash): un día
  - pattern: '*.png'
    headers:
      - key: Cache-Control
        value: public, max-age=86400
